<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Kuantist Logo</title>
  <desc id="desc">Blue and cyan luminous Kuantist ribbon mark.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="64%">
      <stop offset="0%" stop-color="#08246d"/>
      <stop offset="58%" stop-color="#020a2d"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="ribbonA" x1="40" y1="56" x2="218" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ffcff"/>
      <stop offset="22%" stop-color="#0ea5ff"/>
      <stop offset="54%" stop-color="#1d4ed8"/>
      <stop offset="82%" stop-color="#35f6ea"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="ribbonB" x1="56" y1="212" x2="210" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3cff"/>
      <stop offset="28%" stop-color="#1d4ed8"/>
      <stop offset="62%" stop-color="#0ea5ff"/>
      <stop offset="100%" stop-color="#4dfff0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.08 0 0 0 0 0.55 0 0 0 0 1 0 0 0 0.72 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="12" flood-color="#03113f" flood-opacity="0.7"/>
    </filter>
  </defs>
  <rect width="256" height="256" fill="url(#bg)"/>
  <g filter="url(#softShadow)">
    <g filter="url(#glow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path
        d="M79 74h57c41 0 74 25 74 56s-33 56-74 56H92c-31 0-56-25-56-56s25-56 56-56h20"
        stroke="url(#ribbonA)"
        stroke-width="38"
        transform="rotate(31 128 130)"
      />
      <path
        d="M74 74h57c41 0 74 25 74 56s-33 56-74 56H87c-31 0-56-25-56-56s25-56 56-56h20"
        stroke="url(#ribbonB)"
        stroke-width="38"
        transform="rotate(-31 128 130)"
        opacity="0.92"
      />
    </g>
  </g>
  <circle cx="128" cy="130" r="39" fill="#020617"/>
  <circle cx="128" cy="130" r="40" fill="none" stroke="#5bf4ff" stroke-opacity="0.34" stroke-width="2"/>
</svg>
